<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vocabulary</title>
    <script>
      // Applied before first paint so there's no light-mode flash when the
      // saved (or system) preference is dark. Mirrors the default-resolution
      // logic in src/lib/preferences.ts — keep the two in sync.
      (function () {
        try {
          var raw = localStorage.getItem('spanish-app:preferences');
          var theme = raw ? JSON.parse(raw).theme : undefined;
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore — falls back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
