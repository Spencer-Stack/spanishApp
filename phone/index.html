<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Vocab Test" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>Vocab Test</title>
    <script>
      // Same before-first-paint dark-mode logic as the desktop app — no
      // light-mode flash when the system preference is dark.
      (function () {
        try {
          var raw = localStorage.getItem('spanish-vocab-phone:theme');
          var theme = raw === 'light' || raw === 'dark' ? raw : undefined;
          if (!theme) {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore — falls back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
